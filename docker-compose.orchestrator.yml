# Overlay for docker-compose.node.yml: docker compose -f docker-compose.node.yml -f docker-compose.orchestrator.yml up -d

services:
  socketproxy:
    image: docker.io/tecnativa/docker-socket-proxy:0.3.0
    restart: unless-stopped
    read_only: true
    security_opt:
      - no-new-privileges:true
    environment:
      CONTAINERS: "1"
      NETWORKS: "1"
      VOLUMES: "1"
      IMAGES: "1"
      POST: "1"
      EXEC: "0"
      SERVICES: "0"
      SWARM: "0"
      SECRETS: "0"
      BUILD: "0"
      COMMIT: "0"
      CONFIGS: "0"
      DISTRIBUTION: "0"
      PLUGINS: "0"
      SYSTEM: "0"
      AUTH: "0"
      INFO: "0"
      EVENTS: "0"
      NODES: "0"
      SESSION: "0"
      TASKS: "0"
    tmpfs:
      - /run:size=8m,mode=0755
      - /tmp:size=8m,mode=1777
    volumes:
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        read_only: true
    networks:
      - docker_api
    mem_limit: ${CITE_SOCKETPROXY_MEM:-128m}
    cpus: ${CITE_SOCKETPROXY_CPUS:-0.5}
    pids_limit: ${CITE_SOCKETPROXY_PIDS:-128}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  connector:
    depends_on:
      socketproxy:
        condition: service_started
    environment:
      CITE_DOCKER_HOST: tcp://socketproxy:2375
    networks:
      - docker_api

networks:
  docker_api:
    driver: bridge
    internal: true
