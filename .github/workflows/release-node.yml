name: release-node

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-node-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/seggys116

jobs:
  version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Stops a tag that disagrees with Cargo.toml from publishing images under the wrong version.
      - id: check
        run: |
          cargo_version="$(awk -F'"' '/^version = /{print $2; exit}' Cargo.toml)"
          if [[ "${GITHUB_REF_NAME#v}" != "$cargo_version" ]]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${cargo_version}" >&2
            exit 1
          fi
          echo "version=${cargo_version}" >> "$GITHUB_OUTPUT"

  images:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        variant:
          - { key: connector, name: cite-connector, dockerfile: images/connector/Dockerfile }
          - { key: dashboard, name: cite-dashboard, dockerfile: images/dashboard/Dockerfile }
          - { key: dockerproxy, name: cite-dockerproxy, dockerfile: images/dockerproxy/Dockerfile }
        platform:
          - { arch: amd64, runner: ubuntu-latest }
          - { arch: arm64, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.platform.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ${{ matrix.variant.dockerfile }}
          platforms: linux/${{ matrix.platform.arch }}
          build-args: |
            VERSION=${{ needs.version.outputs.version }}
            REVISION=${{ github.sha }}
          # Each arch is pushed by digest only; the manifests job joins them into the tagged multi-arch image.
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}/${{ matrix.variant.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.variant.key }}-${{ matrix.platform.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant.key }}-${{ matrix.platform.arch }}
      - env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digests-${{ matrix.variant.key }}-${{ matrix.platform.arch }}
          path: digests/*

  manifests:
    needs: [version, images]
    strategy:
      fail-fast: false
      matrix:
        variant:
          - { key: connector, name: cite-connector, suffix: "" }
          - { key: dashboard, name: cite-dashboard, suffix: "" }
          - { key: dockerproxy, name: cite-dockerproxy, suffix: "" }
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: digests-${{ matrix.variant.key }}-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - env:
          IMAGE: ${{ env.IMAGE_PREFIX }}/${{ matrix.variant.name }}
          HUB_IMAGE: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.variant.name }}
          SUFFIX: ${{ matrix.variant.suffix }}
          VERSION: ${{ needs.version.outputs.version }}
        working-directory: digests
        run: |
          sources=()
          for digest in *; do sources+=("${IMAGE}@sha256:${digest}"); done
          docker buildx imagetools create \
            -t "${IMAGE}:${VERSION}${SUFFIX}" \
            -t "${IMAGE}:latest${SUFFIX}" \
            -t "${HUB_IMAGE}:${VERSION}${SUFFIX}" \
            -t "${HUB_IMAGE}:latest${SUFFIX}" \
            "${sources[@]}"
