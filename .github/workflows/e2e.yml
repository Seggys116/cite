name: e2e

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          docker build -f images/manager/Dockerfile -t cite-manager:dev .
          docker build -f images/mock-github/Dockerfile -t cite-mock-github:dev .
          docker build -f images/executor-node/Dockerfile -t cite-executor-node:e2e .
      - run: ./scripts/e2e-first-deploy.sh
      - run: ./scripts/e2e-fault.sh
      - if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-logs
          path: target/e2e-*
          if-no-files-found: ignore
      - if: always()
        env:
          CITE_GITHUB_TOKEN: teardown
        run: |
          docker rm -f cite-e2e-layout >/dev/null 2>&1 || true
          docker compose -p cite-e2e -f docker-compose.dev.yml -f docker-compose.e2e.yml -f docker-compose.e2e-static.yml --profile mock down -v --remove-orphans || true
          docker volume rm -f cite-e2e_cite_data || true

  runtimes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario: [pnpm, npm, yarn, bun, static, node24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f images/mock-github/Dockerfile -t cite-mock-github:dev .
      - if: matrix.scenario != 'node24'
        run: docker build -f images/manager/Dockerfile -t cite-manager:dev .
      - if: contains(fromJSON('["pnpm","npm","yarn"]'), matrix.scenario)
        run: docker build -f images/executor-node/Dockerfile -t cite-executor-node:e2e .
      - if: matrix.scenario == 'bun'
        run: docker build -f images/executor-bun/Dockerfile -t cite-executor-bun:e2e .
      - if: matrix.scenario == 'static'
        run: docker build -f images/executor-static/Dockerfile -t cite-executor-static:e2e .
      - if: matrix.scenario == 'node24'
        run: |
          docker build -f images/manager/Dockerfile -t cite-manager:dev-node24 \
            --build-arg NODE_MAJOR=24 \
            --build-arg NODE_IMAGE=docker.io/library/node:24-bookworm-slim@sha256:0e0ff40c39bc087845bfb27465a0df4ea419520094bc35842ff83dd8cbe6f9b6 .
          docker build -f images/executor-node/Dockerfile -t cite-executor-node:e2e-node24 \
            --build-arg NODE_MAJOR=24 \
            --build-arg EXECUTOR_IMAGE=gcr.io/distroless/nodejs24-debian12:nonroot@sha256:14d42e2511532589a7c7e01a753667a74fcc96266e137e8125006b87b0c32d0a .
      - run: ./scripts/e2e-runtimes.sh ${{ matrix.scenario }}
