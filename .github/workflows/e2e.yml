name: e2e

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: |
          docker build -f images/manager/Dockerfile -t cite-manager:dev .
          docker build -f images/mock-github/Dockerfile -t cite-mock-github:dev .
          docker build -f images/executor-node/Dockerfile -t cite-executor-node:e2e .
      - run: ./scripts/e2e-first-deploy.sh
      - run: ./scripts/e2e-fault.sh
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-logs
          path: target/e2e-*
          if-no-files-found: ignore
      - if: always()
        env:
          CITE_GITHUB_TOKEN: teardown
        run: |
          docker rm -f cite-e2e-layout >/dev/null 2>&1 || true
          docker compose -p cite-e2e -f docker-compose.dev.yml -f docker-compose.e2e.yml -f docker-compose.e2e-static.yml --profile mock down -v --remove-orphans || true
          docker volume rm -f cite-e2e_cite_data || true

  runtimes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        scenario: [pnpm, npm, yarn, bun, static, node24]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: docker build -f images/mock-github/Dockerfile -t cite-mock-github:dev .
      - if: matrix.scenario != 'node24'
        run: docker build -f images/manager/Dockerfile -t cite-manager:dev .
      - if: contains(fromJSON('["pnpm","npm","yarn"]'), matrix.scenario)
        run: docker build -f images/executor-node/Dockerfile -t cite-executor-node:e2e .
      - if: matrix.scenario == 'bun'
        run: docker build -f images/executor-bun/Dockerfile -t cite-executor-bun:e2e .
      - if: matrix.scenario == 'static'
        run: docker build -f images/executor-static/Dockerfile -t cite-executor-static:e2e .
      - if: matrix.scenario == 'node24'
        run: |
          docker build -f images/manager/Dockerfile -t cite-manager:dev-node24 \
            --build-arg NODE_MAJOR=24 \
            --build-arg NODE_IMAGE=docker.io/library/node:24-bookworm-slim@sha256:dc26ae92c9fb15cf6b1d63e20f0944b2efe0f115b20e00be48fb23fceb061c54 .
          docker build -f images/executor-node/Dockerfile -t cite-executor-node:e2e-node24 \
            --build-arg NODE_MAJOR=24 \
            --build-arg EXECUTOR_IMAGE=gcr.io/distroless/nodejs24-debian13:nonroot@sha256:6abfcb367ebc291572c774c1592a986be2ab26a2486f73093401327495a5962a .
      - run: ./scripts/e2e-runtimes.sh ${{ matrix.scenario }}

  data:
    # Builds eight images and runs two nodes, so it only runs when dispatched by hand.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the site data services end to end script
        run: CITE_VERSION=0.0.1 bash scripts/e2e-data.sh
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-data-logs
          path: target/e2e-data-logs
          if-no-files-found: ignore

  upgrade:
    # Pulls the previous release, builds the current images and upgrades a node in place, so it only runs when dispatched by hand.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Upgrade a 0.4.1 node in place
        run: E2E_LOG_DIR=target/e2e-upgrade-logs bash scripts/e2e-upgrade.sh
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-upgrade-logs
          path: target/e2e-upgrade-logs
          if-no-files-found: ignore
