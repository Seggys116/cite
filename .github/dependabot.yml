version: 2

updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 3
    groups:
      rust-minor-patch:
        update-types: ["minor", "patch"]

  - package-ecosystem: cargo
