[package]
name = "cite-desktop"
version = "0.4.1"
edition = "2024"
license = "MIT"
rust-version = "1.88"
description = "Desktop console for Cite nodes"

[workspace]

[dependencies]
gpui = "0.2"
cite-client = { path = "../../crates/cite-client" }
cite-edge = { path = "../../crates/cite-edge" }
keyring = { version = "3", features = ["apple-native", "linux-native-sync-persistent", "windows-native"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
unicode-segmentation = "1"

[dev-dependencies]
gpui = { version = "0.2", features = ["test-support"] }
tempfile = "3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"
