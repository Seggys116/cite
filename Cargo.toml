[workspace]
resolver = "3"
members = [
    "crates/cite-core",
    "crates/cite-manager",
    "crates/cite-executor",
    "crates/cite-mock-github",
]
exclude = ["fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.88"
repository = "https://github.com/seggys116/cite"

[workspace.dependencies]
cite-core = { path = "crates/cite-core" }
cite-executor = { path = "crates/cite-executor" }
cite-mock-github = { path = "crates/cite-mock-github" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "0.8"
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
cap-std = "4"
rustix = { version = "1", features = ["fs", "process", "net", "param"] }
sha2 = "0.10"
subtle = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
ulid = "1"
regex = "1"
ipnet = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls-webpki-roots"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "client-legacy", "http1"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
arc-swap = "1"
mime_guess = "2"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tower = "0.5"
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["io", "codec"] }
proptest = "1"
tempfile = "3"
libc = "0.2"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
