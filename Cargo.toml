[workspace]
resolver = "3"
members = [
    "crates/cite-core",
    "crates/cite-edge",
    "crates/cite-store",
    "crates/cite-connector",
    "crates/cite-dockerproxy",
    "crates/cite-client",
    "crates/cite-dashboard",
    "crates/cite-manager",
    "crates/cite-executor",
    "crates/cite-egress",
    "crates/cite-mock-github",
    "crates/cite-tls",
]
exclude = ["fuzz", "apps/desktop"]

[workspace.package]
version = "0.5.0"
edition = "2024"
license = "MIT"
rust-version = "1.100"
repository = "https://github.com/seggys116/cite"

[workspace.dependencies]
cite-core = { path = "crates/cite-core" }
cite-edge = { path = "crates/cite-edge" }
cite-store = { path = "crates/cite-store" }
cite-client = { path = "crates/cite-client" }
cite-executor = { path = "crates/cite-executor" }
cite-mock-github = { path = "crates/cite-mock-github" }
cite-tls = { path = "crates/cite-tls" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.2"
tar = { version = "0.4", default-features = false }
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
cap-std = "4"
rustix = { version = "1", features = ["fs", "process", "net", "param"] }
sha2 = "0.11"
subtle = "2"
time = { version = "0.3", features = ["formatting", "parsing"] }
ulid = "3"
regex = "1"
ipnet = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "query", "stream", "rustls-no-provider"] }
hyper = { version = "1", features = ["http1", "server", "client"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "server-auto", "client-legacy", "http1"] }
http = "1"
http-body = "1"
http-body-util = "0.1"
bytes = "1"
arc-swap = "1"
mime_guess = "2"
clap = { version = "4", features = ["derive"] }
axum = "0.8"
tower = "0.5"
futures-util = "0.3"
proptest = "1"
tempfile = "3"
rusqlite = { version = "0.43", features = ["bundled"] }
x509-parser = "0.18"
pem = "4"
zeroize = "1"
base64 = "0.23"
ring = "0.17"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
strip = "symbols"
