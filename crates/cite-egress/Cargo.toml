[package]
name = "cite-egress"
description = "Cite egress proxy: public-internet-only forward proxy for site executors"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "cite_egress"
path = "src/lib.rs"

[[bin]]
name = "cite-egress"
path = "src/main.rs"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
