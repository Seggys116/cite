# Node stack: HAProxy edge plus the connector. Add -f docker-compose.orchestrator.yml to let the connector start site stacks.

name: cite-node

services:
  init:
    image: ghcr.io/seggys116/cite-connector:${CITE_VERSION:-0.3.1}
    restart: "no"
    user: "0:0"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - FOWNER
      # Needed only to reach into /conf once it belongs to 10001, so a volume from an older release can still get its missing directories.
      - DAC_OVERRIDE
    entrypoint: ["/bin/sh", "-c"]
    # /run/cite is fixed on every start. A new volume gets its directories and ownership once; the loop then adds any directory a volume from an older release lacks, because HAProxy mounts them by subpath and its container cannot be created when one is missing.
    # With no haproxy.cfg yet, a bootstrap config is written so HAProxy starts and answers 404 on port 80 until the connector's first apply replaces it; it is the only copy of that text (a connector test checks it with haproxy -c).
    command:
      - >-
        chown 10001:10001 /run/cite && chmod 0750 /run/cite && (
        [ "$$(stat -c %u /conf)" = 10001 ] || (
        mkdir -p /conf/haproxy /conf/certs /conf/state &&
        chmod 0750 /conf/haproxy /conf/certs /conf/state /conf &&
        chown 10001:10001 /conf/haproxy /conf/certs /conf/state /conf ) ) &&
        for d in haproxy certs state; do
        [ -d "/conf/$$d" ] || ( mkdir "/conf/$$d" && chmod 0750 "/conf/$$d" && chown 10001:10001 "/conf/$$d" );
        done &&
        ( [ -e /conf/haproxy/haproxy.cfg ] || (
        printf '%s\n' 'global' '    maxconn 256' 'defaults' '    mode http' '    timeout connect 5s' '    timeout client 30s' '    timeout server 30s' 'frontend fe_boot' '    bind :80' '    http-request return status 404 content-type text/plain string "no sites configured yet"' > /conf/haproxy/.haproxy.cfg.boot &&
        chown 10001:10001 /conf/haproxy/.haproxy.cfg.boot &&
        chmod 0640 /conf/haproxy/.haproxy.cfg.boot &&
        mv /conf/haproxy/.haproxy.cfg.boot /conf/haproxy/haproxy.cfg ) )
    volumes:
      - type: volume
        source: cite_conf
        target: /conf
      - type: volume
        source: cite_run
        target: /run/cite
    network_mode: none
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  haproxy:
    image: docker.io/library/haproxy:3.2-bookworm
    restart: unless-stopped
    container_name: cite-node-haproxy
    depends_on:
      init:
        condition: service_completed_successfully
    init: true
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    sysctls:
      net.ipv4.ip_unprivileged_port_start: "0"
    # The -S socket must match CITE_HAPROXY_MASTER on the connector; the admin socket path comes from the rendered config.
    command: ["haproxy", "-W", "-db", "-S", "/run/cite/master.sock,level,admin", "-f", "/conf/haproxy/haproxy.cfg"]
    tmpfs:
      - /tmp:size=32m,mode=1777,noexec,nosuid,nodev
    volumes:
      - type: volume
        source: cite_conf
        target: /conf/haproxy
        read_only: true
        volume:
          subpath: haproxy
      - type: volume
        source: cite_conf
        target: /conf/certs
        read_only: true
        volume:
          subpath: certs
      - type: volume
        source: cite_run
        target: /run/cite
    ports:
      - target: 80
        published: ${CITE_HTTP_PORT:-80}
        host_ip: ${CITE_PUBLIC_BIND:-0.0.0.0}
        protocol: tcp
      - target: 443
        published: ${CITE_HTTPS_PORT:-443}
        host_ip: ${CITE_PUBLIC_BIND:-0.0.0.0}
        protocol: tcp
    networks:
      public:
      cite_edge:
    mem_limit: ${CITE_HAPROXY_MEM:-1g}
    cpus: ${CITE_HAPROXY_CPUS:-2.0}
    pids_limit: ${CITE_HAPROXY_PIDS:-512}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  connector:
    image: ghcr.io/seggys116/cite-connector:${CITE_VERSION:-0.3.1}
    restart: unless-stopped
    depends_on:
      init:
        condition: service_completed_successfully
      haproxy:
        condition: service_started
    init: true
    user: "10001:10001"
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    environment:
      CITE_CONNECTOR_ALLOW: ${CITE_CONNECTOR_ALLOW:?set CITE_CONNECTOR_ALLOW in .env}
      CITE_CONNECTOR_LISTEN: 0.0.0.0:7443
      CITE_HAPROXY_RUNTIME: unix:/run/cite/admin.sock
      CITE_HAPROXY_MASTER: unix:/run/cite/master.sock
      CITE_LOG_LISTEN: unix:/run/cite/log.sock
      CITE_LOG_ADDR: /run/cite/log.sock
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - type: volume
        source: cite_conf
        target: /conf
      - type: volume
        source: cite_run
        target: /run/cite
    ports:
      - target: 7443
        published: ${CITE_CONNECTOR_PORT:-7443}
        host_ip: ${CITE_CONNECTOR_BIND:?set the IP to expose the connector on}
        protocol: tcp
    networks:
      public:
    mem_limit: ${CITE_CONNECTOR_MEM:-512m}
    cpus: ${CITE_CONNECTOR_CPUS:-1.0}
    pids_limit: ${CITE_CONNECTOR_PIDS:-256}
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "cite-connector", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  cite_conf:
  # Unix sockets shared by HAProxy and the connector: admin, master CLI and the log datagram socket.
  cite_run:

networks:
  public:
    driver: bridge
  cite_edge:
    name: cite_edge
    driver: bridge
    internal: true
